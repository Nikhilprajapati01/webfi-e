<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reverse String</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 50px;
    }
    input, button {
      padding: 8px 12px;
      margin: 10px;
      font-size: 16px;
    }
    #result {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
    <h1>Reverse string</h1>
  <input type="text" id="inputStr" placeholder="Enter text">
  <button onclick="reverseString()">Reverse</button>
  <div id="result"></div>

  <script>
    function reverseString() {
      const input = document.getElementById("inputStr").value;
      const reversed = input.split('').reverse().join('');
      document.getElementById("result").textContent = `reversed string: ${reversed}`;
    }
  </script>
</body>
</html>
