<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>String Length Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f4f4f4;
      text-align: center;
    }

    input[type="text"] {
      padding: 10px;
      width: 250px;
      font-size: 16px;
    }

    button {
      padding: 10px 20px;
      margin-left: 10px;
      font-size: 16px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <h1>String Length Finder</h1>
  <input type="text" id="inputString" placeholder="Enter your string here">
  <button onclick="getLength()">Check Length</button>

  <div id="result"></div>

  <script>
    function getLength() {
      const str = document.getElementById("inputString").value;
      const length = str.length;
      document.getElementById("result").textContent = `Length: ${length}`;
    }
  </script>

</body>
</html>
