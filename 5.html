<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Find Largest Number</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }
    input, button {
      padding: 8px;
      font-size: 16px;
      margin: 10px;
      width: 300px;
    }
    #output {
      font-weight: bold;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <h2>Find the Largest Number</h2>
  <input type="text" id="numInput" placeholder="Enter numbers separated by commas">
  <button onclick="findLargest()">Find Largest</button>
  <div id="output"></div>

  <script>
    function findLargest() {
      const input = document.getElementById("numInput").value;
      const numbers = input.split(',').map(n => parseFloat(n.trim()));
      
      if (numbers.some(isNaN)) {
        document.getElementById("output").textContent = "Please enter valid numbers.";
        return;
      }

      const largest = Math.max(...numbers);
      document.getElementById("output").textContent = `Largest number is: ${largest}`;
    }
  </script>
</body>
</html>
