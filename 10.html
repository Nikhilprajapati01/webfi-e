<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title> Event handling Buttons</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; padding: 40px; }
    button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    #log { margin-top: 30px; font-size: 18px; color: #444; }
  </style>
</head>
<body>

  <h2>Different Buttons with Event Handling</h2>

  <button id="clickBtn">Click Me</button>
  <button id="hoverBtn">Hover Over Me</button>
  <button id="dblClickBtn">Double Click Me</button>
  <button id="keydownBtn">Focus & Press a Key</button><br>

  <input type="text" id="inputField" placeholder="Focus here for keydown">

  <div id="log">Event log will appear here</div>

  <script>
    const log = document.getElementById("log");

    document.getElementById("clickBtn").addEventListener("click", () => {
      log.textContent = "Click button clicked!";
    });

    document.getElementById("hoverBtn").addEventListener("mouseover", () => {
      log.textContent = "Hover button hovered!";
    });

    document.getElementById("dblClickBtn").addEventListener("dblclick", () => {
      log.textContent = "Double-click button double-clicked!";
    });

    document.getElementById("inputField").addEventListener("keydown", (e) => {
      log.textContent = `Key pressed in input: ${e.key}`;
    });
  </script>

</body>
</html>
